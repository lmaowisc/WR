name: Build and publish WR documentation

on:
  push:
    branches: [master]
    paths:
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "data/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "_pkgdown.yml"
      - "website/**"
      - ".github/workflows/pkgdown.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
      - name: Build pkgdown documentation
        run: Rscript -e 'pkgdown::build_site(pkg = ".", dest_dir = "docs")'
      - name: Add the WR homepage
        run: cp website/index.html website/wr-home.css website/wr-home.js docs/
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
